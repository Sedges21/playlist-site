<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Playlists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
    color: #fff; background: #8c6b5a; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .hidden { display: none !important; }

  /* 배경: 현재 커버를 크게 블러 처리 + 갈색/회색 틴트 */
  .bg { position: fixed; inset: -120px; background: var(--cover, none) center/cover;
        filter: blur(80px) saturate(.55); transform: scale(1.3); z-index: -2; transition: background-image .4s; }
  body.themed .bg { inset: -60px; filter: blur(40px); transform: scale(1.1); }
  body.themed .tint { display: none; }
  .tint { position: fixed; inset: 0; z-index: -1;
          background: linear-gradient(115deg, rgba(150,100,75,.78) 0%, rgba(185,165,160,.5) 50%,
                                              rgba(175,160,165,.4) 70%, rgba(150,105,80,.72) 100%); }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- 첫 화면: 플레이리스트 목록 ---------- */
  .home { min-height: 100vh; padding: 7vh 6vw; }
  /* 첫 화면은 다크 테마 */
  body.at-home { background: #121212; }
  .bg, .tint { transition: opacity .45s ease; }
  body.at-home:not(.peek) .bg, body.at-home:not(.peek) .tint { opacity: 0; }   /* 카드에 마우스를 올렸을 때만 색 보이기 */
  .home h1 { font-weight: 400; font-size: clamp(28px, 4vw, 48px); margin-bottom: 4vh; text-shadow: 0 1px 8px rgba(0,0,0,.2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 32px 28px; }
  .card { background: none; border: 0; color: #fff; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
  .card .thumb { width: 100%; aspect-ratio: 1; border-radius: 18px; background: rgba(255,255,255,.15) center/cover;
                 box-shadow: 7px 8px 0 rgba(0,0,0,.10), 0 10px 26px rgba(0,0,0,.18); transition: transform .18s; }
  .card:hover .thumb { transform: translateY(-4px); }
  .card .name { font-size: 19px; }
  .card .count { font-size: 13px; opacity: .75; margin-top: -6px; }
  .empty { opacity: .8; font-size: 16px; }

  /* ---------- 재생 화면 ---------- */
  .player { height: 100vh; overflow: hidden; }
  .back { position: fixed; top: 18px; left: 20px; z-index: 5; background: rgba(255,255,255,.16);
          border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .back:hover { background: rgba(255,255,255,.26); }

  .app { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; padding: 6vh 4vw 5vh; gap: 3vw; }
  .left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8vh; min-width: 0; }
  .cover { width: clamp(160px, min(28vw, calc(100vh - 565px)), 420px); aspect-ratio: 1; border-radius: 22px; background: rgba(255,255,255,.15) center/cover;
           box-shadow: 9px 10px 0 rgba(0,0,0,.10), 0 12px 32px rgba(0,0,0,.18); }
  .title { font-weight: 400; font-size: clamp(22px, min(3.3vw, 5vh), 42px); letter-spacing: .5px; text-align: center;
           text-shadow: 0 1px 8px rgba(0,0,0,.2); }
  .now { font-size: 14px; opacity: .85; min-height: 1.2em; max-width: 44vw; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; margin-top: -1.2vh; }

  .progress { width: min(44vw, 560px); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px;
    background: #fff; outline: none; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }
  .times { display: flex; justify-content: space-between; font-size: 13px; opacity: .85; margin-top: 6px; }

  .controls { display: flex; gap: 52px; align-items: center; }
  .controls button { background: none; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center;
                     filter: drop-shadow(0 1px 3px rgba(0,0,0,.2)); transition: transform .12s; }
  .controls button:hover { transform: scale(1.08); }
  .controls svg { height: 26px; width: auto; fill: currentColor; display: block; }
  .controls .main { width: 26px; }

  .volume { display: flex; align-items: center; gap: 10px; opacity: .9; }
  .shuffle { background: none; border: 0; color: #fff; cursor: pointer; display: grid; place-items: center;
             padding: 3px; border-radius: 6px; opacity: .55; margin-right: 14px; transition: opacity .15s, background .15s; }
  .shuffle svg { width: 20px; height: 20px; fill: currentColor; }
  .shuffle:hover { opacity: .85; }
  .shuffle { position: relative; }
  .shuffle.on { opacity: 1; }
  .shuffle.on::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 4px; height: 4px;
                       margin-left: -2px; border-radius: 50%; background: #fff; }   /* 켜짐 표시 점 */
  .date { font-size: 16px; opacity: .9; letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0,0,0,.2); margin-bottom: -.6vh; }
  body.has-date .cover { width: clamp(150px, min(28vw, calc(100vh - 590px)), 420px); }
  .volume button { background: none; border: 0; color: #fff; cursor: pointer; display: grid; }
  .volume svg { width: 22px; height: 22px; fill: currentColor; }
  .volume input[type=range] { width: 140px; height: 5px;
    background: linear-gradient(#fff, #fff) 0/var(--p, 0%) 100% no-repeat, rgba(255,255,255,.45); }   /* 음량만큼 흰색으로 채움 */
  .volume input[type=range]::-webkit-slider-thumb { width: 14px; height: 14px; }
  .volume input[type=range]::-moz-range-thumb { width: 14px; height: 14px; }

  .right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  /* 곡 검색창 */
  .search { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 6px 10px 0; padding: 4px 10px;
            border-bottom: 2px solid rgba(255,255,255,.55); transition: border-color .15s; }
  .search:focus-within { border-color: #fff; }
  .search svg { width: 18px; height: 18px; fill: #fff; opacity: .8; flex: none; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff;
                  font: inherit; font-size: 17px; padding: 4px 0; }
  .search input::placeholder { color: rgba(255,255,255,.65); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search .hits { font-size: 13px; opacity: .8; white-space: nowrap; }
  .search .clear { background: none; border: 0; color: #fff; cursor: pointer; font-size: 18px; line-height: 1;
                   opacity: .75; padding: 0 2px; }
  .search .clear:hover { opacity: 1; }
  li.hide { display: none; }
  .no-hit { font-size: 15px; opacity: .75; padding: 6px 8px; }
  ol { list-style: none; flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px;
       font-size: 18px; line-height: 1.2; scrollbar-width: thin; }
  li { cursor: pointer; padding: 1px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden;
       text-overflow: ellipsis; transition: background .15s; }
  li::before { content: "▶"; font-size: .8em; margin-right: .5em; }
  li:hover { background: rgba(255,255,255,.14); }
  li.playing { background: rgba(255,255,255,.26); }
  li.blocked { opacity: .45; text-decoration: line-through; }

  /* 유튜브 규칙: 플레이어는 최소 200×200px로 보여야 함 → 숨기지 않음 */
  .yt-wrap { flex: none; width: 356px; height: 200px; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.25);
             margin-top: .6vh; box-shadow: 0 8px 24px rgba(0,0,0,.18); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(40,28,22,.92);
           padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none;
           transition: opacity .25s; max-width: 90vw; z-index: 20; }
  .toast.show { opacity: 1; }

  @media (max-width: 800px) {
    .player { height: auto; overflow: visible; }
    .app { grid-template-columns: 1fr; height: auto; padding-top: 70px; }
    .cover { width: 70vw; }
    .progress, .now { width: 85vw; max-width: 85vw; }
    ol { max-height: 50vh; }
    .yt-wrap { width: 100%; max-width: 356px; }
  }
</style>
</head>
<body class="at-home">
<div class="bg"></div><div class="tint"></div>

<!-- 첫 화면 -->
<section class="view home" id="homeView">
  <h1 id="siteTitle">Playlists</h1>
  <div class="grid" id="grid"></div>
  <p class="empty" id="homeMsg">불러오는 중…</p>
</section>

<!-- 재생 화면 -->
<section class="view player" id="playerView">
  <button class="back" id="backBtn">← 목록</button>
  <main class="app">
    <div class="left">
      <div class="date hidden" id="plDate"></div>
      <div class="cover" id="cover" role="img" aria-label="재생목록 커버"></div>
      <h2 class="title" id="plTitle"></h2>
      <div class="now" id="now"></div>
      <div class="progress">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="이전 곡"><svg viewBox="0 0 34 26"><path d="M0 13 17 0v26zM17 13 34 0v26z"/></svg></button>
        <button id="play" class="main" aria-label="재생"><svg viewBox="0 0 22 26" id="playIcon"><path d="M2 0l20 13-20 13z"/></svg></button>
        <button id="next" aria-label="다음 곡"><svg viewBox="0 0 34 26"><path d="M34 13 17 0v26zM17 13 0 0v26z"/></svg></button>
      </div>
      <div class="volume">
        <button class="shuffle" id="shuffle" aria-label="셔플" aria-pressed="false" title="셔플">
          <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z"/></svg>
        </button>
        <button id="mute" aria-label="음소거"><svg viewBox="0 0 24 24" id="volIcon"></svg></button>
        <input type="range" id="vol" min="0" max="100" value="70" aria-label="음량">
      </div>
      <div class="yt-wrap"><div id="yt"></div></div>
    </div>
    <div class="right">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input type="search" id="q" placeholder="곡 검색" aria-label="이 플레이리스트에서 곡 검색" autocomplete="off">
        <span class="hits" id="hits"></span>
        <button class="clear hidden" id="qClear" aria-label="검색어 지우기">×</button>
      </div>
      <div class="no-hit hidden" id="noHit">찾는 곡이 없어요.</div>
      <ol id="list"></ol>
    </div>
  </main>
</section>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const { cfg, db, coverUrl, normalizeTracks, fmtTime, escapeHtml, toast, themeImage } = window.App;
const $ = id => document.getElementById(id);
const ICON_PLAY = '<path d="M2 0l20 13-20 13z"/>';
const ICON_PAUSE = '<path d="M2 0h7v26H2zM13 0h7v26h-7z"/>';   // 사진처럼 굵은 막대 두 개

let playlists = [];          // 공개된 플레이리스트 전체
let current = null;          // 지금 열린 플레이리스트
let player = null, ytReady = false, cuedFor = null, seeking = false, lastIdx = -1;

document.title = cfg.SITE_TITLE;
$("siteTitle").textContent = cfg.SITE_TITLE;

/* 배경: 지정한 색(theme)이 있으면 그 색으로, 없으면 커버를 흐리게 */
function setBg(p) {
  const url = p ? (p.bg || p.cover) : "";
  document.body.classList.toggle("themed", !!(p && p.bg));
  document.body.style.setProperty("--cover", url ? `url("${url}")` : "none");
}

/* ===================== 데이터 불러오기 ===================== */
async function loadPlaylists() {
  const { data, error } = await db
    .from("playlists")
    .select("id,title,yt_list_id,cover_path,tracks,sort_order,theme,playlist_date,show_date")
    .eq("is_published", true)
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });
  if (error) {
    $("homeMsg").textContent = "목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.";
    console.error(error);
    return;
  }
  playlists = data.map(p => ({ ...p, tracks: normalizeTracks(p.tracks), cover: coverUrl(p.cover_path),
                               bg: themeImage(p.theme) }));
  renderHome();
  route();
}

/* ===================== 첫 화면 ===================== */
function renderHome() {
  const grid = $("grid");
  grid.innerHTML = "";
  $("homeMsg").textContent = playlists.length ? "" : "아직 올라온 플레이리스트가 없어요.";
  for (const p of playlists) {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<div class="thumb"></div><div class="name">${escapeHtml(p.title)}</div>
                   <div class="count">${[p.tracks.length ? p.tracks.length + "곡" : "",
                                         p.show_date && p.playlist_date ? p.playlist_date.replaceAll("-", ".") : ""]
                                        .filter(Boolean).join(" · ")}</div>`;
    if (p.cover) b.querySelector(".thumb").style.backgroundImage = `url("${p.cover}")`;
    b.onclick = () => go(p.id);
    b.onmouseenter = () => { setBg(p); document.body.classList.add("peek"); };
    b.onmouseleave = () => document.body.classList.remove("peek");
    grid.appendChild(b);
  }
}

/* ===================== 화면 전환 (?p=플레이리스트ID) ===================== */
function go(id) {
  const url = id ? `?p=${encodeURIComponent(id)}` : location.pathname;
  history.pushState(null, "", url);
  route();
}
window.addEventListener("popstate", route);
$("backBtn").onclick = () => go(null);

function route() {
  const id = new URLSearchParams(location.search).get("p");
  const p = id && playlists.find(x => x.id === id);
  if (p) openPlaylist(p);
  else {
    if (id && playlists.length) toast("플레이리스트를 찾을 수 없어요.");
    showHome();
  }
}
function showHome() {
  if (ytReady && player.stopVideo) player.stopVideo();
  current = null;
  cuedFor = null;
  $("playerView").classList.remove("active");
  $("homeView").classList.add("active");
  document.title = cfg.SITE_TITLE;
  document.body.classList.add("at-home");
}

/* ===================== 재생 화면 ===================== */
function openPlaylist(p) {
  current = p;
  $("homeView").classList.remove("active");
  $("playerView").classList.add("active");
  document.title = "Playlist : " + p.title;
  $("plTitle").textContent = "Playlist : " + p.title;
  $("cover").style.backgroundImage = p.cover ? `url("${p.cover}")` : "";
  document.body.classList.remove("at-home", "peek");
  setBg(p);
  $("now").textContent = "";
  const showDate = !!(p.show_date && p.playlist_date);
  $("plDate").textContent = showDate ? p.playlist_date.replaceAll("-", ".") : "";
  $("plDate").classList.toggle("hidden", !showDate);
  document.body.classList.toggle("has-date", showDate);
  lastIdx = -1;

  const list = $("list");
  list.innerHTML = "";
  p.tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.textContent = t.name;
    li.title = t.name;
    li.onclick = () => playTrack(i);
    list.appendChild(li);
  });
  $("q").value = "";
  filterList();
  fitList();
  cueCurrent();
}

/* 곡 수에 맞춰 목록 글자 크기 조절: 한 화면에 다 들어가게, 너무 작아지면(12px) 스크롤 */
function fitList() {
  const ol = $("list");
  const n = ol.children.length;
  if (!n) return;
  const maxPx = Math.min(20, Math.max(14, window.innerWidth * 0.0145));
  const fit = (ol.clientHeight - n * 2 - 4) / (n * 1.2);   // 줄마다 위아래 여백 2px 포함
  let px = Math.floor(Math.max(12, Math.min(maxPx, fit)) * 10) / 10;
  ol.style.fontSize = px + "px";
  // 브라우저마다 줄 높이 반올림이 달라서, 넘치면 조금씩 더 줄임
  while (px > 12 && ol.scrollHeight > ol.clientHeight + 1) {
    px = Math.max(12, px - 0.3);
    ol.style.fontSize = px.toFixed(1) + "px";
  }
}
window.addEventListener("resize", () => { if (current) fitList(); });

function cueCurrent() {
  if (!ytReady || !current || cuedFor === current.id) return;
  baseIds = null;
  arranged = false;
  player.cuePlaylist({ listType: "playlist", list: current.yt_list_id, index: 0 });
  cuedFor = current.id;
}

/* ===================== 재생 순서 (셔플을 사이트가 직접 관리) =====================
   baseIds: 유튜브 재생목록의 원래 순서 (영상 ID 배열)
   셔플을 켜면 이 순서를 섞어서 '섞인 순서의 재생목록'을 플레이어에 다시 넣어요.
   그래서 다음/이전/자동 넘김이 모두 같은 섞인 순서를 따라가고, 한 바퀴 안에서는 곡이 겹치지 않아요. */
let baseIds = null, arranged = false;

function shuffled(arr) {                      // Fisher–Yates
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function ensureBase() {
  if (baseIds && baseIds.length) return true;
  const pl = player.getPlaylist();
  if (pl && pl.length) baseIds = pl.slice();
  return !!(baseIds && baseIds.length);
}
/** 셔플 상태에 맞는 순서로 플레이어 재생목록을 다시 넣음. 지금 듣던 곡과 위치는 유지 */
function applyOrder() {
  if (!ensureBase()) return;
  const vid = (player.getVideoData() || {}).video_id;
  const t = player.getCurrentTime() || 0;
  const st = player.getPlayerState();
  const playing = st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING;
  let order, idx;
  if (shuffleOn) {
    const k = vid ? baseIds.indexOf(vid) : -1;
    const rest = baseIds.filter((_, i) => i !== k);
    order = k >= 0 && (playing || t > 0) ? [vid, ...shuffled(rest)] : shuffled(baseIds);
    idx = 0;
  } else {
    order = baseIds.slice();
    idx = Math.max(0, vid ? baseIds.indexOf(vid) : 0);
  }
  const startAt = order[idx] === vid ? t : 0;
  if (playing) player.loadPlaylist(order, idx, startAt);
  else player.cuePlaylist(order, idx, startAt);
}
/** 한 바퀴를 다 들었을 때: 셔플이면 새로 섞어서 처음부터 (방금 끝난 곡이 바로 다시 나오지 않게) */
function nextRound(autoplay) {
  if (!ensureBase()) return;
  const last = (player.getVideoData() || {}).video_id;
  let order = shuffleOn ? shuffled(baseIds) : baseIds.slice();
  if (shuffleOn && order.length > 1 && order[0] === last) [order[0], order[1]] = [order[1], order[0]];
  autoplay ? player.loadPlaylist(order, 0) : player.cuePlaylist(order, 0);
}
function goNext() {
  const pl = player.getPlaylist() || [];
  const i = player.getPlaylistIndex();
  if (i >= 0 && i < pl.length - 1) player.playVideoAt(i + 1);
  else nextRound(true);
}
function goPrev() {
  const i = player.getPlaylistIndex();
  if (i > 0) player.playVideoAt(i - 1);
  else player.seekTo(0, true);
}

function playTrack(i) {
  if (!ytReady) return toast("플레이어를 불러오는 중이에요.");
  const t = current.tracks[i];
  if (t.videoId) {
    const pl = player.getPlaylist() || [];
    const j = pl.indexOf(t.videoId);
    if (j >= 0) return player.playVideoAt(j);
    return toast("이 곡은 지금 유튜브 재생목록에 없어요.");
  }
  player.playVideoAt(i); // 영상 ID가 없는 곡은 순서로 맞춤
}

/* 지금 나오는 곡을 목록에서 찾기: 영상 ID 우선, 없으면 순서 */
function currentTrackIndex() {
  const vid = (player.getVideoData() || {}).video_id;
  if (vid) {
    const i = current.tracks.findIndex(t => t.videoId === vid);
    if (i >= 0) return i;
  }
  const hasIds = current.tracks.some(t => t.videoId);
  return hasIds ? -1 : player.getPlaylistIndex();
}
function highlight(i) {
  const items = $("list").children;
  if (items[lastIdx]) items[lastIdx].classList.remove("playing");
  if (items[i]) {
    items[i].classList.add("playing");
    items[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  lastIdx = i;
}

/* ===================== 유튜브 플레이어 ===================== */
function onYouTubeIframeAPIReady() {
  player = new YT.Player("yt", {
    width: "356", height: "200",
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { ytReady = true; applyVol(); cueCurrent(); },
      onStateChange: onState,
      onError: onError,
    },
  });
}
function onState(e) {
  if (!current) return;
  // 유튜브 재생목록을 처음 불러왔을 때 원래 순서를 기억하고, 셔플이 켜져 있으면 섞은 순서로 다시 넣음
  if (!arranged && ensureBase()) {
    arranged = true;
    if (shuffleOn) { applyOrder(); return; }
  }
  // 마지막 곡이 끝나면: 셔플이면 새로 섞어서 계속, 아니면 멈춤
  if (e.data === YT.PlayerState.ENDED) {
    const pl = player.getPlaylist() || [];
    if (shuffleOn && player.getPlaylistIndex() === pl.length - 1) { nextRound(true); return; }
  }
  const playing = e.data === YT.PlayerState.PLAYING;
  $("playIcon").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", playing ? "일시정지" : "재생");
  const i = currentTrackIndex();
  if (i !== lastIdx) highlight(i);
  const d = player.getVideoData();
  if (d && d.title) $("now").textContent = "지금 재생: " + (d.author ? d.author.replace(/ - Topic$/, "") + " - " : "") + d.title;
}
function onError(e) {
  const c = e.data;
  if (c === 101 || c === 150 || c === 100) {
    const i = currentTrackIndex();
    if ($("list").children[i]) $("list").children[i].classList.add("blocked");
    toast(c === 100 ? "삭제되었거나 비공개인 곡이라 다음 곡으로 넘어가요." : "이 곡은 외부 재생이 막혀 있어서 다음 곡으로 넘어가요.");
    setTimeout(goNext, 1500);
  } else if (c === 153) toast("재생이 막혔어요(오류 153). 사이트 주소로 접속했는지 확인해 주세요.", 7000);
  else if (c === 2) toast("재생목록 정보가 올바르지 않아요.");
  else toast("재생 오류 (코드 " + c + ")");
}

/* ===================== 컨트롤 ===================== */
$("play").onclick = () => {
  if (!ytReady) return toast("플레이어를 불러오는 중이에요.");
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
};
$("prev").onclick = () => ytReady && current && goPrev();
$("next").onclick = () => ytReady && current && goNext();

const seek = $("seek");
seek.addEventListener("input", () => {
  seeking = true;
  seek.style.setProperty("--p", seek.value / 10 + "%");
  if (ytReady) $("cur").textContent = fmtTime(seek.value / 1000 * (player.getDuration() || 0));
});
seek.addEventListener("change", () => {
  if (ytReady) player.seekTo(seek.value / 1000 * (player.getDuration() || 0), true);
  seeking = false;
});
setInterval(() => {
  if (!ytReady || !current || seeking || !player.getDuration) return;
  const d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
  const v = d ? t / d * 1000 : 0;
  seek.value = v;
  seek.style.setProperty("--p", v / 10 + "%");
  $("cur").textContent = fmtTime(t);
  $("dur").textContent = fmtTime(d);
}, 500);

/* 셔플 (켜고 끈 상태를 기억) */
const SHUF_KEY = "playlist-site:shuffle";
let shuffleOn = false;
try { shuffleOn = localStorage.getItem(SHUF_KEY) === "1"; } catch (e) {}
function drawShuffle() {
  $("shuffle").classList.toggle("on", shuffleOn);
  $("shuffle").setAttribute("aria-pressed", String(shuffleOn));
  $("shuffle").title = shuffleOn ? "셔플 켜짐" : "셔플 꺼짐";
}
$("shuffle").onclick = () => {
  shuffleOn = !shuffleOn;
  drawShuffle();
  try { localStorage.setItem(SHUF_KEY, shuffleOn ? "1" : "0"); } catch (e) {}
  if (ytReady && current && arranged) applyOrder();
  toast(shuffleOn ? "셔플을 켰어요." : "셔플을 껐어요.", 1500);
};
drawShuffle();

/* 음량 (마지막 값을 기억) */
const VOL_KEY = "playlist-site:volume";
const vol = $("vol");
let muted = false;
try { const v = localStorage.getItem(VOL_KEY); if (v !== null) vol.value = v; } catch (e) {}
function drawVol() {
  vol.style.setProperty("--p", vol.value + "%");
  const v = muted ? 0 : +vol.value;
  $("volIcon").innerHTML = v === 0
    ? '<path d="M3 9v6h4l5 5V4L7 9zM16.5 9.6l1.4-1.4L20 10.3l2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/>'
    : v < 50
      ? '<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
}
function applyVol() {
  if (!ytReady) return;
  player.setVolume(+vol.value);
  muted ? player.mute() : player.unMute();
}
vol.addEventListener("input", () => {
  muted = +vol.value === 0;
  drawVol(); applyVol();
  try { localStorage.setItem(VOL_KEY, vol.value); } catch (e) {}
});
$("mute").onclick = () => { muted = !muted; drawVol(); applyVol(); };
drawVol();

/* 스페이스바 = 재생/일시정지 */
/* 곡 검색: 대소문자·띄어쓰기 무시하고 이름에 포함되면 표시 */
const norm = s => s.toLowerCase().replace(/\s+/g, "");
function filterList() {
  const q = norm($("q").value);
  const items = $("list").children;
  let shown = 0;
  for (const li of items) {
    const hit = !q || norm(li.textContent).includes(q);
    li.classList.toggle("hide", !hit);
    if (hit) shown++;
  }
  $("hits").textContent = q ? shown + "곡" : "";
  $("qClear").classList.toggle("hidden", !q);
  $("noHit").classList.toggle("hidden", !(q && shown === 0));
}
$("q").addEventListener("input", filterList);
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") {                       // 첫 번째 결과 재생
    e.preventDefault();
    const first = [...$("list").children].findIndex(li => !li.classList.contains("hide"));
    if (first >= 0) playTrack(first);
  } else if (e.key === "Escape") {
    $("q").value = ""; filterList(); $("q").blur();
  }
});
$("qClear").onclick = () => { $("q").value = ""; filterList(); $("q").focus(); };

document.addEventListener("keydown", e => {
  if (e.code === "Space" && current && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault(); $("play").click();
  }
});

$("homeView").classList.add("active");
loadPlaylists();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
